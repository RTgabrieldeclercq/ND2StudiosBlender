<!doctype html>
<meta charset="utf-8">
<title>__TITLE__</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{ --bg:#070b12; --panel:rgba(14,21,32,.9); --line:rgba(120,150,180,.16);
    --text:#dce6f0; --muted:#8ba0b6; --accent:#31d0c6;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--sans);color:var(--text);}
  canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #axlab{position:fixed;inset:0;pointer-events:none;z-index:3;font-family:var(--mono);}
  .axl{position:absolute;font-size:11.5px;transform:translate(-50%,-50%);white-space:nowrap;}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.55);}
  #hud{top:14px;left:14px;width:318px;max-height:calc(100vh - 28px);overflow-y:auto;padding:14px 15px;z-index:6;}
  #hud::-webkit-scrollbar{width:8px;} #hud::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  #hud h1{font-size:15px;margin:0 0 2px;font-weight:640;letter-spacing:-.01em;}
  #hud .sub{font-size:11.5px;color:var(--muted);margin:0 0 10px;line-height:1.4;}
  details{border-top:1px solid var(--line);margin-top:8px;}
  summary{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);
    cursor:pointer;padding:8px 0 6px;font-family:var(--mono);list-style:none;display:flex;align-items:center;gap:8px;}
  summary::-webkit-details-marker{display:none;}
  summary:before{content:"▸";} details[open] summary:before{content:"▾";}
  summary .kind{color:var(--muted);letter-spacing:0;text-transform:none;font-size:10.5px;margin-left:auto;}
  summary input[type=checkbox]{accent-color:var(--accent);margin:0;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0;}
  .row label{font-size:11.5px;color:var(--text);flex:1;}
  input[type=range]{width:118px;accent-color:var(--accent);height:16px;}
  select{background:#0c1521;color:var(--text);border:1px solid var(--line);border-radius:6px;
    font-family:var(--mono);font-size:11px;padding:3px 5px;}
  .val{font-family:var(--mono);font-size:10.5px;color:var(--accent);min-width:40px;text-align:right;}
  .tg{font-family:var(--mono);font-size:10.5px;padding:4px 9px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--muted);user-select:none;}
  .tg.on{color:#04121a;background:var(--accent);border-color:var(--accent);font-weight:600;}
  .toggles{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0;}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px;}
  .btn{font-family:var(--mono);font-size:10.5px;padding:5px 10px;border-radius:7px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--text);user-select:none;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .lbar{height:7px;border-radius:4px;margin:4px 0 2px;}
  .lends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted);}
  /* view buttons */
  #views{top:14px;right:14px;display:flex;gap:6px;padding:8px 10px;flex-wrap:wrap;justify-content:flex-end;z-index:5;max-width:40vw;}
  /* timeline */
  #tl{bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 14px;z-index:5;
    font-family:var(--mono);font-size:11px;min-width:min(560px,80vw);}
  #tl input[type=range]{flex:1;width:auto;min-width:160px;}
  #tl .tv{color:var(--accent);min-width:92px;text-align:right;}
  /* chart */
  #chart{bottom:72px;right:14px;width:380px;padding:10px 12px;z-index:5;}
  #chart canvas{width:100%;height:190px;display:block;}
  #chart .ttl{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between;}
  #stats{bottom:14px;right:14px;padding:9px 12px;font-family:var(--mono);font-size:10.5px;color:var(--muted);z-index:5;max-width:300px;}
  #stats b{color:var(--text);}
  #hudToggle{position:fixed;top:12px;left:12px;z-index:8;display:none;font-family:var(--mono);
    font-size:12.5px;padding:9px 13px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);cursor:pointer;user-select:none;}
  html.embed #hud,html.embed #views,html.embed #hudToggle,html.embed #stats{display:none !important;}
  html.embed #cv{pointer-events:none;}
  @media (max-width:820px){
    #hudToggle{display:block;}
    #hud{display:none;top:56px;left:10px;width:min(86vw,330px);max-height:calc(100vh - 160px);}
    #hud.open{display:block;}
    #views{transform:scale(.8);transform-origin:top right;max-width:60vw;}
    #chart{width:min(86vw,330px);bottom:70px;left:10px;right:auto;}
    #stats{display:none;}
    #tl{min-width:0;left:10px;right:10px;transform:none;}
    .axl{font-size:10px;}
  }
</style>

<canvas id="cv"></canvas>
<div id="axlab"></div>
<div id="hudToggle">☰ Layers</div>

<div class="panel" id="hud">
  <h1>__TITLE__</h1>
  <p class="sub">__SUBTITLE__ Drag = orbit · right-drag / shift-drag = pan · scroll = zoom.</p>
  <div class="toggles">
    <span class="tg on" data-k="axes">Axes (µm)</span>
    <span class="tg" data-k="white">White</span>
    <span class="tg" data-k="spin">Auto-spin</span>
    <span class="tg on" data-k="chart">Chart</span>
  </div>
  <div id="layers"></div>
  <details><summary>Scene</summary>
    <div class="row"><label>z-stretch</label><input id="zs" type="range" min="0.25" max="20" step="0.25" value="1"><span class="val" id="zsv">1.0</span></div>
    <div class="row"><label>Fog</label><input id="fog" type="range" min="0" max="1" step="0.05" value="0.35"><span class="val" id="fogv">0.35</span></div>
    <div class="row"><label>Spin speed</label><input id="sps" type="range" min="0" max="3" step="0.1" value="1"><span class="val" id="spsv">1.0</span></div>
  </details>
  <div class="btns">
    <span class="btn" id="reset">Reset view</span><span class="btn" id="snap">Snapshot (PNG)</span>
  </div>
</div>

<div class="panel" id="views">
  <span class="btn" data-view="1,1,1">Iso</span><span class="btn" data-view="0,0,1">Top</span>
  <span class="btn" data-view="0,-1,0">Front</span><span class="btn" data-view="1,0,0">Side</span>
  <span class="btn" id="home">⌂</span>
</div>

<div class="panel" id="tl" style="display:none">
  <span class="btn" id="play">▶</span>
  <input id="tslider" type="range" min="0" max="0" step="1" value="0">
  <span class="tv" id="tval"></span>
  <select id="tspeed"><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
</div>

<div class="panel" id="chart" style="display:none"><div class="ttl"><span id="chartTitle"></span><span id="chartVal"></span></div><canvas id="chartcv"></canvas></div>
<div class="panel" id="stats"></div>

<script>
const SCENE = __SCENE__;
const META = SCENE.meta;
function dec(b64, T){const s = atob(b64); const u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return new T(u.buffer);}
const B = META.bounds, LO = B[0], HI = B[1];
const SPAN = [HI[0]-LO[0], HI[1]-LO[1], HI[2]-LO[2]];
const CENTER = [(LO[0]+HI[0])/2, (LO[1]+HI[1])/2, (LO[2]+HI[2])/2];
const RAD = Math.max(SPAN[0], SPAN[1], SPAN[2]*0.5) * 0.62;
const TIMES = META.times.length ? META.times : [0];
const EMBED = new URLSearchParams(location.search).get('embed') === '1';
if (EMBED) document.documentElement.classList.add('embed');

// ---------- state ----------
const st = {axes: true, white: false, spin: false, chart: true};
const P = {zs: 1, fog: 0.35, sps: 1};
let zScale = 1, tIndex = 0, playing = false, playSpeed = 1, lastTick = 0;
const THEME = {
  dark: {fog: [0.05, 0.08, 0.13], grid: [0.42, 0.5, 0.6], gridA: 0.32, label: '#cfe0ee', bg0: [0.015, 0.015, 0.015], bg1: [0.05, 0.09, 0.14]},
  white: {fog: [0.96, 0.97, 0.98], grid: [0.45, 0.5, 0.55], gridA: 0.55, label: '#222a33', bg0: [0.985, 0.988, 0.992], bg1: [0.94, 0.95, 0.965]}};
function theme(){return st.white ? THEME.white : THEME.dark;}
function curTime(){return TIMES[Math.min(tIndex, TIMES.length-1)];}
function frameAt(frames, t){let lo = 0, hi = frames.length - 1, best = 0;
  while (lo <= hi){const m = (lo + hi) >> 1; if (frames[m].t <= t + 1e-9){best = m; lo = m + 1;} else hi = m - 1;}
  return best;}

// ---------- gl ----------
const cv = document.getElementById('cv');
const gl = cv.getContext('webgl2', {antialias: true, alpha: false, preserveDrawingBuffer: true});
if (!gl) document.getElementById('hud').innerHTML = '<h1>WebGL2 required</h1>';
function sh(t, s){const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);
  if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o) + "\n" + s; return o;}
function prog(v, f){const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, v));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, f)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw gl.getProgramInfoLog(p); return p;}
const CMAP = `uniform float uCmap;
vec3 turbo(float t){t=clamp(t,0.,1.);vec3 a=vec3(0.13,0.07,0.23),b=vec3(0.25,0.27,0.67),
 c=vec3(0.12,0.63,0.53),d=vec3(0.63,0.78,0.14),e=vec3(0.98,0.82,0.23),f=vec3(0.82,0.19,0.02);
 if(t<0.2)return mix(a,b,t/0.2);if(t<0.4)return mix(b,c,(t-0.2)/0.2);
 if(t<0.6)return mix(c,d,(t-0.4)/0.2);if(t<0.8)return mix(d,e,(t-0.6)/0.2);return mix(e,f,(t-0.8)/0.2);}
vec3 poly(float t,vec3 c0,vec3 c1,vec3 c2,vec3 c3,vec3 c4,vec3 c5,vec3 c6){
 return clamp(c0+t*(c1+t*(c2+t*(c3+t*(c4+t*(c5+t*c6))))),0.,1.);}
vec3 viridis(float t){return poly(t,vec3(0.2778,0.0054,0.3341),vec3(0.1051,1.4046,1.3846),
 vec3(-0.3309,0.2148,0.0951),vec3(-4.6342,-5.7991,-19.3324),vec3(6.2283,14.1799,56.6906),
 vec3(4.7764,-13.7451,-65.3530),vec3(-5.4355,4.6459,26.3124));}
vec3 inferno(float t){return poly(t,vec3(0.0002,0.0017,-0.0195),vec3(0.1065,0.5639,3.9327),
 vec3(11.6025,-3.9729,-15.9424),vec3(-41.7040,17.4364,44.3541),vec3(77.1629,-33.4024,-81.8073),
 vec3(-71.3194,32.6261,73.2095),vec3(25.1311,-12.2427,-23.0703));}
vec3 plasma(float t){return poly(t,vec3(0.0587,0.0233,0.5433),vec3(2.1765,0.2384,0.7540),
 vec3(-2.6895,-7.4559,3.1108),vec3(6.1303,42.3462,-28.5189),vec3(-11.1074,-82.6663,60.1398),
 vec3(10.0231,71.4136,-54.0722),vec3(-3.6587,-22.9315,18.1919));}
vec3 magma(float t){return poly(t,vec3(-0.0021,-0.0007,-0.0054),vec3(0.2517,0.6775,2.4940),
 vec3(8.3537,-3.5777,0.3145),vec3(-27.6687,14.2647,-13.6492),vec3(52.1761,-27.9436,12.9442),
 vec3(-50.7685,29.0466,4.2342),vec3(18.6557,-11.4898,-5.6020));}
vec3 cool(float t){return vec3(t,0.35+0.4*t,1.0-0.4*t);}
vec3 cmap(float t){int m=int(uCmap+0.5);t=clamp(t,0.,1.);
 if(m==0)return turbo(t);if(m==1)return viridis(t);if(m==2)return inferno(t);
 if(m==3)return plasma(t);if(m==4)return magma(t);if(m==6)return cool(t);return vec3(t);}`;
const FOG = `uniform float uFogN,uFogF,uFogAmt;uniform vec3 uFogC;
float fogf(vec4 mv){return clamp((-mv.z-uFogN)/(uFogF-uFogN),0.,1.)*uFogAmt;}`;
const WORLD = `uniform vec3 uCenter;uniform float uZS;
vec3 world(vec3 p){return vec3(p.x,p.y,uCenter.z+(p.z-uCenter.z)*uZS);}`;

const pBg = gl && prog(`#version 300 es
 const vec2 v[3]=vec2[3](vec2(-1.,-1.),vec2(3.,-1.),vec2(-1.,3.));out vec2 uv;
 void main(){uv=v[gl_VertexID];gl_Position=vec4(v[gl_VertexID],0.,1.);}`,
 `#version 300 es
 precision highp float;in vec2 uv;out vec4 o;uniform vec3 uC0,uC1;
 void main(){float t=(uv.y+1.)*.5;o=vec4(mix(uC0,uC1,t),1.);}`);
const pGrid = gl && prog(`#version 300 es
 layout(location=0)in vec3 aPos;uniform mat4 uMVP;${WORLD}
 void main(){gl_Position=uMVP*vec4(world(aPos),1.);}`,
 `#version 300 es
 precision highp float;out vec4 o;uniform vec4 uColor;void main(){o=uColor;}`);
// ribbon lines (streamlines, tracks): screen-space width, scalar colour, time gating
const pRib = gl && prog(`#version 300 es
 layout(location=0)in vec3 aPos;layout(location=1)in vec3 aDir;layout(location=2)in float aVal;
 layout(location=3)in float aSide;layout(location=4)in float aT;
 uniform mat4 uMVP,uMV;uniform float uVpH,uAspect,uWidth,uLo,uHi,uTime,uTail,uTimeMode;${WORLD}${FOG}
 out float vT,vF,vA;
 void main(){vec3 pA=world(aPos),pB=world(aPos+aDir);
  vec4 cA=uMVP*vec4(pA,1.),cB=uMVP*vec4(pB,1.);
  vec2 nA=cA.xy/cA.w,nB=cB.xy/cB.w;
  vec2 dir=normalize((nB-nA)*vec2(uAspect,1.)+vec2(1e-6,0.));
  vec2 perp=vec2(-dir.y,dir.x)/vec2(uAspect,1.);
  cA.xy+=perp*aSide*(uWidth/uVpH)*cA.w;gl_Position=cA;
  vT=clamp((aVal-uLo)/max(uHi-uLo,1e-6),0.,1.);vF=fogf(uMV*vec4(pA,1.));
  vA=1.0;
  if(uTimeMode>0.5){if(aT>uTime+1e-6)vA=0.0;else if(uTail>0.0){vA=clamp(1.0-(uTime-aT)/uTail,0.0,1.0);}}}`,
 `#version 300 es
 precision highp float;in float vT,vF,vA;out vec4 o;uniform float uAlpha,uMode;uniform vec3 uColor;${FOG}${CMAP}
 void main(){if(vA<=0.001)discard;vec3 c=uMode>0.5?cmap(vT):uColor;c=mix(c,uFogC,vF);
  float a=uAlpha*vA;o=vec4(c*a,a);}`);
// instanced vector glyphs: a ribbon from p to p + v*scale, tapered
const pGlyph = gl && prog(`#version 300 es
 layout(location=0)in float aEnd;layout(location=1)in float aSide;
 layout(location=2)in vec3 iP;layout(location=3)in vec3 iV;layout(location=4)in float iM;
 uniform mat4 uMVP,uMV;uniform float uVpH,uAspect,uWidth,uScale,uLo,uHi,uMode;${WORLD}${FOG}
 out float vT,vF;
 void main(){vec3 p0=world(iP),p1=world(iP+iV*uScale);
  vec4 c0=uMVP*vec4(p0,1.),c1=uMVP*vec4(p1,1.);
  vec2 n0=c0.xy/c0.w,n1=c1.xy/c1.w;
  vec2 dir=normalize((n1-n0)*vec2(uAspect,1.)+vec2(1e-6,0.));
  vec2 perp=vec2(-dir.y,dir.x)/vec2(uAspect,1.);
  vec4 c=aEnd>0.5?c1:c0;float w=uWidth*(1.0-0.75*aEnd);
  c.xy+=perp*aSide*(w/uVpH)*c.w;gl_Position=c;
  float t=uMode<1.5?iM:(0.5+0.5*iV.z/max(length(iV),1e-9));
  vT=clamp((t-uLo)/max(uHi-uLo,1e-6),0.,1.);if(uMode>1.5)vT=clamp(t,0.,1.);
  vF=fogf(uMV*vec4(p0,1.));}`,
 `#version 300 es
 precision highp float;in float vT,vF;out vec4 o;uniform float uAlpha,uMode;uniform vec3 uColor;${FOG}${CMAP}
 void main(){vec3 c=uMode>2.5?uColor:cmap(vT);c=mix(c,uFogC,vF);o=vec4(c*uAlpha,uAlpha);}`);
// instanced spheres (objects)
const pSph = gl && prog(`#version 300 es
 layout(location=0)in vec3 aPos;layout(location=1)in vec3 aNrm;
 layout(location=2)in vec3 iC;layout(location=3)in float iR;layout(location=4)in float iVal;
 uniform mat4 uMVP,uMV;uniform float uSize,uLo,uHi,uMode,uZ0,uZ1;${WORLD}${FOG}
 out vec3 vN;out float vT,vF;
 void main(){vec3 c=world(iC);vec3 W=c+aPos*iR*uSize;gl_Position=uMVP*vec4(W,1.);
  vN=normalize(mat3(uMV)*aNrm);
  float t=uMode<1.5?iVal:clamp((iC.z-uZ0)/max(uZ1-uZ0,1e-6),0.,1.);
  vT=uMode<1.5?clamp((t-uLo)/max(uHi-uLo,1e-6),0.,1.):t;vF=fogf(uMV*vec4(W,1.));}`,
 `#version 300 es
 precision highp float;in vec3 vN;in float vT,vF;out vec4 o;uniform float uAlpha,uMode;uniform vec3 uColor;${FOG}${CMAP}
 void main(){vec3 N=normalize(vN);vec3 L=normalize(vec3(0.4,0.55,0.75));
  float df=max(dot(N,L),0.);float rim=pow(1.-abs(N.z),2.);
  vec3 base=uMode<0.5?uColor:cmap(vT);
  vec3 c=base*(0.3+0.7*df)+vec3(0.6,0.7,0.85)*rim*0.2;c=mix(c,uFogC,vF*0.7);o=vec4(c,uAlpha);}`);
// iso mesh
const pIso = gl && prog(`#version 300 es
 layout(location=0)in vec3 aPos;layout(location=1)in vec3 aN;
 uniform mat4 uMVP,uMV;uniform vec3 uOrigin;${WORLD}${FOG}out vec3 vN;out float vF;
 void main(){vec3 W=world(uOrigin+aPos);gl_Position=uMVP*vec4(W,1.);
  vN=normalize(mat3(uMV)*vec3(aN.x,aN.y,aN.z/uZS));vF=fogf(uMV*vec4(W,1.));}`,
 `#version 300 es
 precision highp float;in vec3 vN;in float vF;out vec4 o;uniform float uAlpha;uniform vec3 uColor;${FOG}
 void main(){vec3 N=normalize(vN);vec3 L=normalize(vec3(0.4,0.55,0.75));
  float df=abs(dot(N,L));float rim=pow(1.-abs(N.z),2.);
  vec3 c=uColor*(0.28+0.72*df)+vec3(0.7,0.8,0.95)*rim*0.25;c=mix(c,uFogC,vF*0.6);o=vec4(c*uAlpha,uAlpha);}`);
// volume: ray-march a 3D texture inside its box (MIP or emission/absorption)
const pVol = gl && prog(`#version 300 es
 layout(location=0)in vec3 aUnit;uniform mat4 uMVP;uniform vec3 uOrigin,uSize;${WORLD}out vec3 vW;
 void main(){vec3 p=uOrigin+aUnit*uSize;vW=world(p);gl_Position=uMVP*vec4(vW,1.);}`,
 `#version 300 es
 precision highp float;precision highp sampler3D;in vec3 vW;out vec4 o;
 uniform sampler3D uTex;uniform vec3 uEye,uOrigin,uSize,uColor;uniform float uLo,uHi,uMode,uSteps,uAlpha,uDensity;
 ${WORLD}${CMAP}
 vec3 toLocal(vec3 w){vec3 p=vec3(w.x,w.y,uCenter.z+(w.z-uCenter.z)/uZS);return (p-uOrigin)/uSize;}
 float win(float v){return clamp((v-uLo)/max(uHi-uLo,1e-6),0.,1.);}
 void main(){vec3 ro=toLocal(uEye);vec3 rd=normalize(toLocal(vW)-ro);
  vec3 inv=1.0/(rd+vec3(1e-9));vec3 t0=(vec3(0.)-ro)*inv,t1=(vec3(1.)-ro)*inv;
  vec3 tmin=min(t0,t1),tmax=max(t0,t1);float tn=max(max(tmin.x,tmin.y),tmin.z),tf=min(min(tmax.x,tmax.y),tmax.z);
  tn=max(tn,0.0);if(tf<=tn)discard;
  float n=uSteps;float dt=(tf-tn)/n;float mx=0.0;vec3 col=vec3(0.);float A=0.0;
  for(float i=0.0;i<512.0;i+=1.0){if(i>=n)break;vec3 p=ro+rd*(tn+(i+0.5)*dt);
   float v=win(texture(uTex,p).r);
   if(uMode<0.5){mx=max(mx,v);}
   else{float a=v*v*uDensity*dt*8.0;a=clamp(a,0.,1.);vec3 c=uCmap>=0.0?cmap(v):uColor;
    col+=(1.0-A)*a*c;A+=(1.0-A)*a;if(A>0.97)break;}}
  if(uMode<0.5){if(mx<=0.003)discard;vec3 c=cmap(mx);o=vec4(c*mx*uAlpha,mx*uAlpha);}
